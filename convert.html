  <body
    class="bg-background text-foreground antialiased h-screen w-screen overflow-hidden flex flex-col"
  >
    <!-- Navbar -->
    <header
      class="h-14 border-b border-border flex items-center px-6 bg-background z-10 shrink-0"
    >
      <div class="flex items-center gap-2 font-semibold text-lg tracking-tight">
        <i data-lucide="image" class="w-5 h-5"></i>
        <span>Resizer</span>
      </div>
      <div class="ml-auto">
        <button
          id="reset-btn"
          class="hidden text-sm font-medium text-muted-foreground hover:text-foreground transition-colors"
        >
          Start Over
        </button>
      </div>
    </header>

    <!-- VIEW 1: Upload Screen -->
    <main
      id="view-upload"
      class="flex-1 flex flex-col items-center justify-center p-4 bg-gray-50/50"
    >
      <div class="w-full max-w-md space-y-4 text-center">
        <h1 class="text-2xl font-bold tracking-tight">Convert an image</h1>

        <div
          id="upload-zone"
          class="mt-6 relative group cursor-pointer flex flex-col items-center justify-center w-full h-48 rounded-xl border-2 border-dashed border-input hover:border-primary/50 hover:bg-accent/50 transition-all bg-background"
        >
          <input
            type="file"
            id="file-input"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
            accept="image/png, image/jpeg, image/webp"
          />

          <div
            class="flex flex-col items-center justify-center space-y-3 pointer-events-none"
          >
            <div
              class="p-3 bg-secondary rounded-full group-hover:bg-background transition-colors shadow-sm"
            >
              <i data-lucide="upload-cloud" class="w-6 h-6 text-foreground"></i>
            </div>
            <div class="space-y-1">
              <p class="text-sm font-medium">Click to upload or drag & drop</p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- VIEW 2: Editor Screen (Hidden by default) -->
    <main id="view-editor" class="flex-1 hidden flex-row overflow-hidden">
      <!-- Left: Image Preview Area -->
      <section
        class="flex-1 relative bg-secondary/30 checkered-bg flex items-center justify-center p-8 overflow-hidden"
      >
        <!-- This image src is dynamically updated with the processed Blob -->
        <img
          id="preview-image"
          class="max-w-full max-h-full object-contain shadow-2xl rounded-sm ring-1 ring-black/5"
          src=""
          alt="Processed Preview"
        />
      </section>

      <!-- Right: Sidebar Controls -->
      <aside
        class="w-80 sm:w-96 bg-background border-l border-border flex flex-col shadow-xl z-10"
      >
        <div class="p-6 flex-1 overflow-y-auto space-y-8">
          <!-- File Info -->
          <div class="space-y-3">
            <h3
              class="text-sm font-medium text-foreground uppercase tracking-wider"
            >
              Statistics
            </h3>
            <div class="grid grid-cols-2 gap-3">
              <div class="p-3 rounded-lg border border-border bg-gray-50/50">
                <span class="text-xs text-muted-foreground block mb-1"
                  >Original Size</span
                >
                <span
                  id="stat-original"
                  class="text-sm font-semibold text-foreground"
                  >-</span
                >
              </div>
              <div class="p-3 rounded-lg border border-border bg-gray-50/50">
                <span class="text-xs text-muted-foreground block mb-1"
                  >New Size (Est)</span
                >
                <span id="stat-new" class="text-sm font-semibold text-primary"
                  >-</span
                >
              </div>
            </div>
          </div>

          

          <!-- Resize Controls -->
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-medium text-foreground" id="stat-dimensions">Resize</h3>
              <span
                id="val-scale"
                class="text-xs font-mono bg-secondary px-2 py-1 rounded text-foreground"
                >100%</span
              >
            </div>

            <input
              type="range"
              id="input-scale"
              min="1"
              max="100"
              value="100"
              class="w-full"
            />
          </div>

          

          <!-- Format Controls -->
          <div class="space-y-4">
            <h3 class="text-sm font-medium text-foreground">Format</h3>
            <div class="grid grid-cols-2 gap-2 p-1 bg-secondary rounded-lg">
              <button
                type="button"
                class="format-btn flex items-center justify-center py-2 text-sm font-medium rounded-md transition-all shadow-sm bg-background text-foreground"
                data-format="image/jpeg"
              >
                JPG
              </button>
              <button
                type="button"
                class="format-btn flex items-center justify-center py-2 text-sm font-medium rounded-md transition-all text-muted-foreground hover:text-foreground"
                data-format="image/png"
              >
                PNG
              </button>
            </div>
          </div>

          <!-- Quality Controls -->
          <div id="quality-group" class="space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-medium text-foreground">Quality</h3>
              <span
                id="val-quality"
                class="text-xs font-mono bg-secondary px-2 py-1 rounded text-foreground"
                >92%</span
              >
            </div>
            <input
              type="range"
              id="input-quality"
              min="1"
              max="100"
              value="92"
              class="w-full"
            />
          </div>
        </div>

        <!-- Footer Action -->
        <div class="p-6 border-t border-border bg-background">
          <button
            id="download-btn"
            class="w-full h-11 inline-flex items-center justify-center rounded-lg text-sm font-semibold text-primary-foreground bg-primary hover:bg-primary/90 transition-colors shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          >
            <i data-lucide="download" class="w-4 h-4 mr-2"></i> Download Image
          </button>
        </div>
      </aside>
    </main>

    <script>
      // --- Elements ---
      const viewUpload = document.getElementById("view-upload");
      const viewEditor = document.getElementById("view-editor");
      const uploadZone = document.getElementById("upload-zone");
      const fileInput = document.getElementById("file-input");
      const resetBtn = document.getElementById("reset-btn");

      // Editor Elements
      const previewImg = document.getElementById("preview-image");
      const statOriginal = document.getElementById("stat-original");
      const statNew = document.getElementById("stat-new");
      const statDim = document.getElementById("stat-dimensions");

      // Inputs
      const inputScale = document.getElementById("input-scale");
      const valScale = document.getElementById("val-scale");

      const inputQuality = document.getElementById("input-quality");
      const valQuality = document.getElementById("val-quality");
      const qualityGroup = document.getElementById("quality-group");

      const formatBtns = document.querySelectorAll(".format-btn");
      const downloadBtn = document.getElementById("download-btn");

      // --- State ---
      let originalImage = null;
      let originalFile = null;
      let blobUrl = null; // To keep track and revoke

      let settings = {
        scale: 1, // 0.01 - 1.00
        quality: 0.92, // 0.01 - 1.00
        format: "image/jpeg",
      };

      // --- Helpers ---
      function formatBytes(bytes, decimals = 1) {
        if (!+bytes) return "0 B";
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ["B", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${
          sizes[i]
        }`;
      }

      // --- Upload Logic ---
      fileInput.addEventListener("change", (e) => loadFile(e.target.files[0]));

      // Drag & Drop Styling
      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("border-primary", "bg-accent");
      });
      uploadZone.addEventListener("dragleave", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("border-primary", "bg-accent");
      });
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("border-primary", "bg-accent");
        if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
      });

      function loadFile(file) {
        if (!file || !file.type.startsWith("image/")) return;

        originalFile = file;
        statOriginal.innerText = formatBytes(file.size);

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            originalImage = img;
            switchView("editor");
            processImage();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      // --- View Switching ---
      function switchView(viewName) {
        if (viewName === "editor") {
          viewUpload.classList.add("hidden");
          viewUpload.classList.remove("flex");
          viewEditor.classList.remove("hidden");
          viewEditor.classList.add("flex");
          resetBtn.classList.remove("hidden");
        } else {
          viewEditor.classList.add("hidden");
          viewEditor.classList.remove("flex");
          viewUpload.classList.remove("hidden");
          viewUpload.classList.add("flex");
          resetBtn.classList.add("hidden");

          // Cleanup
          fileInput.value = "";
          originalImage = null;
          if (blobUrl) URL.revokeObjectURL(blobUrl);
        }
      }

      resetBtn.addEventListener("click", () => switchView("upload"));

      // --- Image Processing ---
      async function processImage() {
        if (!originalImage) return;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");

        // Calculate new dimensions
        const width = Math.round(originalImage.width * settings.scale);
        const height = Math.round(originalImage.height * settings.scale);

        statDim.innerText = `${width} x ${height}`;

        canvas.width = width;
        canvas.height = height;

        await createImageBitmap(originalImage, {
          resizeWidth: width,
          resizeHeight: height,
          resizeQuality: "high",
        }).then((imageBitmap) => ctx.drawImage(imageBitmap, 0, 0));

        const callback = (blob) => {
          if (!blob) return;

          // Update Stats
          statNew.innerText = formatBytes(blob.size);

          // Update Preview
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = URL.createObjectURL(blob);
          previewImg.src = blobUrl;

          // Construct filename
          const namelist = [originalFile.name.split(".")[0]];
          if (settings.format !== "image/png" && settings.quality < 1)
            namelist.push(inputQuality.value);
          if (settings.scale != 1)
            namelist.push(`scale${inputScale.value}`);

          // Update Download Button
          const ext = settings.format === "image/png" ? "png" : "jpg";
          downloadBtn.onclick = () => {
            const link = document.createElement("a");
            link.download = `${namelist.join(" ")}.${ext}`;
            link.href = blobUrl;
            link.click();
          };
        };

        // Export to blob
        if (settings.format === "image/png") {
          canvas.toBlob(callback, settings.format);
        } else {
          canvas.toBlob(callback, settings.format, settings.quality);
        }
      }

      // --- SCALE ---

      // 1. Update text immediately while dragging
      inputScale.addEventListener("input", (e) => {
        valScale.innerText = `${e.target.value}%`;
        const width = Math.round(originalImage.width * e.target.value / 100);
        const height = Math.round(originalImage.height * e.target.value / 100);
        statDim.innerText = `${width} x ${height}`;
      });

      // 2. Run heavy processing only when released/committed
      inputScale.addEventListener("change", (e) => {
        // Ensure text is synced (just in case)
        valScale.innerText = `${e.target.value}%`; 
        settings.scale = parseInt(e.target.value) / 100;
        processImage();
      });


      // --- QUALITY ---

      // 1. Update text immediately while dragging
      inputQuality.addEventListener("input", (e) => {
        valQuality.innerText = `${e.target.value}%`;
      });

      // 2. Run heavy processing only when released/committed
      inputQuality.addEventListener("change", (e) => {
        // Ensure text is synced
        valQuality.innerText = `${e.target.value}%`;
        settings.quality = parseInt(e.target.value) / 100;
        processImage();
      });

      // Format
      formatBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          // UI Toggle
          formatBtns.forEach((b) => {
            b.classList.remove("bg-background", "text-foreground", "shadow-sm");
            b.classList.add("text-muted-foreground", "hover:text-foreground");
          });
          btn.classList.remove(
            "text-muted-foreground",
            "hover:text-foreground"
          );
          btn.classList.add("bg-background", "text-foreground", "shadow-sm");

          // Logic
          settings.format = btn.dataset.format;

          // PNG usually doesn't support the quality param in toBlob the same way JPG does
          // but standard canvas API allows it for some formats.
          // Usually for PNG it's ignored, so we hide the slider to avoid confusion.
          if (settings.format === "image/png") {
            qualityGroup.classList.add("opacity-50", "pointer-events-none");
          } else {
            qualityGroup.classList.remove("opacity-50", "pointer-events-none");
          }

          processImage();
        });
      });
    </script>
