<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Processor</title>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        textarea { width: 100%; height: 150px; font-family: monospace; }
        button { padding: 10px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background-color: #0056b3; }
        label { font-weight: bold; }
    </style>
</head>
<body>

    <label for="inputJson">Input JSON:</label>
    <textarea id="inputJson" placeholder='Paste your JSON here (e.g., [[[[0,0,0,0,0,0,["","H"]],[0,0,0,0,0,0,["","i"]]]]])'></textarea>

    <button onclick="handleProcess()">Process</button>

    <label for="outputResult">Result:</label>
    <textarea id="outputResult" readonly></textarea>

    <script>
        function doit(ggg) {
            var k = [];
            var i = 0;
            while (true) {
                try {
                    // Accessing the specific deep structure requested
                    var value = ggg[0][i][0][0][0][0][0][1];
                    k.push(value);
                    i++;
                } catch (e) {
                    // Break the loop when the index or structure no longer exists
                    break;
                }
            }
            return k.join('');
        }

        function handleProcess() {
            const inputArea = document.getElementById('inputJson');
            const outputArea = document.getElementById('outputResult');
            
            try {
                // Parse the string from textarea into a JSON object
                const jsonObj = JSON.parse(inputArea.value);
                
                // Run your function
                const result = doit(jsonObj);
                
                // Display the result
                outputArea.value = result;
            } catch (err) {
                alert("Invalid JSON input or processing error: " + err.message);
            }
        }
    </script>
</body>
</html>
