<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compress to JPEG (max 3.8MB)</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 60px auto; text-align: center; }
  #status { margin-top: 16px; color: #444; white-space: pre-line; }
</style>
</head>
<body>
<h2>Compress Image to JPEG (≤ 3.8MB)</h2>
<input type="file" id="picker" accept="image/*">
<div id="status"></div>

<script>
const MAX_BYTES = 3.8 * 1024 * 1024;
const QUALITY = 0.92;

const picker = document.getElementById('picker');
const status = document.getElementById('status');

picker.addEventListener('change', () => {
  const file = picker.files[0];
  if (file) handleFile(file);
});

async function handleFile(file) {
  status.textContent = 'Processing...';
  const basename = file.name.replace(/\.[^.]+$/, '');
  const img = await loadImage(file);

  for (const scalePercent of [100, 95, 90, 85, 80, 75, 70, 65, 60, 55, 50, 45, 40, 35, 30, 25, 20, 15, 10, 5]) {
    const blob = await renderJpeg(img, scalePercent / 100);
    status.textContent = `Tried scale ${scalePercent}% -> ${(blob.size / 1024 / 1024).toFixed(2)} MB`;
    if (blob.size <= MAX_BYTES) {
      const filename = scalePercent === 100
        ? `${basename} 92.jpg`
        : `${basename} 92 scale${scalePercent}.jpg`;
      downloadBlob(blob, filename);
      status.textContent += `\nDone. Downloaded "${filename}".`;
      return;
    }
  }
  status.textContent += '\nCould not get under 3.8MB even at 5% scale.';
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function renderJpeg(img, scale) {
  const targetW = Math.max(1, Math.round(img.naturalWidth * scale));
  const targetH = Math.max(1, Math.round(img.naturalHeight * scale));

  const bitmap = await createImageBitmap(img, {
    resizeWidth: targetW,
    resizeHeight: targetH,
    resizeQuality: 'high'
  });

  const canvas = document.createElement('canvas');
  canvas.width = targetW;
  canvas.height = targetH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(0, 0, targetW, targetH);
  ctx.drawImage(bitmap, 0, 0);
  bitmap.close();

  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', QUALITY));
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
