<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                background-color: #f4f4f5;
            }
            #drop-zone {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100vw;
                height: 100vh;
                border: 4px dashed transparent;
                box-sizing: border-box;
                transition: all 0.2s ease-in-out;
                cursor: pointer;
            }
            #drop-zone.dragover {
                background-color: #e4e4e7;
                border-color: #3b82f6;
            }
            .content {
                text-align: center;
                pointer-events: none; /* Let clicks pass through to the drop zone */
            }
            h3 {
                margin: 0 0 10px 0;
                color: #18181b;
            }
            p {
                margin: 0;
                color: #52525b;
            }
            #status {
                margin-top: 20px;
                font-weight: 500;
                color: #27272a;
                pointer-events: auto; /* Allow clicking the generated links */
            }
            a {
                color: #2563eb;
                text-decoration: none;
            }
            a:hover {
                text-decoration: underline;
            }
        </style>
